[project]
name = "iloc"
version = "0.1.0"
description = "CLI to simulate the GPS location a connected iPhone reports, via Apple's DVT developer service. For security research and testing on your own device."
requires-python = ">=3.10"
dependencies = [
    "pymobiledevice3>=10.0.0",
    "click>=8.1",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
iloc = "iloc.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
